[package]
name = "tenrso-ad"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Automatic differentiation support for TenRSo"

[dependencies]
tenrso-core.workspace = true
tenrso-exec.workspace = true
tenrso-decomp.workspace = true
tenrso-planner.workspace = true
scirs2-core.workspace = true
scirs2-linalg.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rayon.workspace = true
num-traits = "0.2"
tensorlogic-infer = { workspace = true, optional = true }
tensorlogic-ir = { workspace = true, optional = true }

[features]
default = []
# Tensorlogic integration (default-OFF).
#
# Enables `tenrso_ad::tensorlogic_bridge`, which implements Tensorlogic's
# `TlExecutor` / `TlAutodiff` traits on top of the TenRSo op registry, and the
# `DenseND <-> ArrayD<f64>` conversions on `TensorlogicAdapter`.
#
# `tensorlogic-ir` is required in addition to `tensorlogic-infer` because
# `TlAutodiff::forward`/`backward` take a `tensorlogic_ir::EinsumGraph`.
tensorlogic = ["dep:tensorlogic-infer", "dep:tensorlogic-ir"]

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
num_cpus.workspace = true

[[bench]]
name = "gradient_benchmarks"
harness = false

[[bench]]
name = "graph_benchmarks"
harness = false

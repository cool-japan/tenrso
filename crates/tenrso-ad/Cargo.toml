[package]
name = "tenrso-ad"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Automatic differentiation support for TenRSo"

[dependencies]
tenrso-core.workspace = true
tenrso-exec.workspace = true
tenrso-decomp.workspace = true
tenrso-planner.workspace = true
scirs2-core.workspace = true
scirs2-linalg.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rayon.workspace = true
num-traits = "0.2"

[features]
default = []
# Feature gate for Tensorlogic integration.
# When enabled, the TensorlogicAdapter methods become available once
# the tensorlogic crate API is wired in. For now this gate marks the
# migration path; enabling it returns a more-specific error message.
tensorlogic = []

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
num_cpus.workspace = true

[[bench]]
name = "gradient_benchmarks"
harness = false

[[bench]]
name = "graph_benchmarks"
harness = false
